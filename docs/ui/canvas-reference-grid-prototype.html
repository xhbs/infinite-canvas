<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参考内容 · 十列换行原型</title>
  <style>
    :root{color-scheme:light;--paper:#f6f5f1;--panel:#fffefa;--ink:#292826;--muted:#8a877f;--line:#e8e4dd;--soft:#f0eee8;--accent:#df6b48;--accent-soft:#fff0e8}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:var(--ink);font:14px/1.6 "DM Sans","Microsoft YaHei","PingFang SC",sans-serif;background-color:var(--paper);background-image:radial-gradient(#bdb6aa55 .8px,transparent .8px);background-size:22px 22px}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button{color:inherit}svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.svg-library{position:absolute;width:0;height:0;overflow:hidden}.page{width:min(960px,100%);margin:auto;padding:36px 24px 46px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}.brand{display:flex;gap:9px;align-items:center;color:var(--ink);letter-spacing:.04em}.brand svg{color:var(--accent)}.prototype-label{border-left:1px solid var(--line);padding-left:10px}.intro{margin:36px 0 26px}.intro h1{font-size:clamp(23px,4vw,32px);font-weight:600;letter-spacing:-.05em;margin:0 0 8px}.intro p{margin:0;color:var(--muted);font-size:13px}.demo-controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:0 auto 18px;width:min(780px,100%)}.tabs{display:flex;gap:4px;flex-wrap:wrap}.tab{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:7px 11px;border-radius:9px;color:var(--muted);white-space:nowrap}.tab[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px #2928260c}.tab svg{width:15px;height:15px}.quantity{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}.quantity button{border:1px solid transparent;background:transparent;border-radius:7px;min-width:29px;height:29px}.quantity button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:#df6b4826}.node{container-type:inline-size;width:min(780px,100%);margin:auto;background:var(--panel);border:1px solid #ebe7df;border-radius:25px;padding:18px;box-shadow:0 18px 55px #2c282014,0 3px 12px #2c282008;animation:appear .35s ease-out}.references-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;color:#77736b;font-size:12px}.reference-count{color:var(--muted);font-size:11px;margin-left:7px}.add{display:flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--muted);padding:2px 4px;border-radius:5px;font-size:12px}.add:hover{color:var(--accent);background:var(--accent-soft)}.add svg{width:14px;height:14px}.reference-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:9px;align-items:start}.reference{min-width:0;position:relative;aspect-ratio:1;border-radius:13px;background:var(--soft);border:1px solid #e6dfd4;isolation:isolate}.reference .photo{width:100%;height:100%;stroke:none;border-radius:12px;overflow:hidden;background:#e2e9e6}.reference .photo use{stroke:none}.media-tag{position:absolute;bottom:3px;right:3px;display:grid;place-items:center;width:17px;height:17px;border-radius:5px;background:#292826a6;color:#fff;pointer-events:none}.media-tag svg{width:10px;height:10px}.reference.text-card,.reference.audio-card{display:grid;place-items:center;background:#eee9df;color:#7b7061}.reference.text-card>svg,.reference.audio-card>svg{width:25px;height:25px}.reference.audio-card{background:#e7ece7;color:#697e70}.reference-number{position:absolute;top:4px;left:5px;color:#fff;text-shadow:0 1px 3px #292826;line-height:1;font-size:10px;pointer-events:none}.text-card .reference-number,.audio-card .reference-number{color:var(--muted);text-shadow:none}.remove{position:absolute;right:-5px;top:-5px;width:19px;height:19px;border-radius:50%;border:2px solid var(--panel);background:#514b43;color:#fff;display:grid;place-items:center;padding:0;opacity:0;z-index:1;transition:opacity .12s}.remove svg{width:10px;height:10px}.reference:hover .remove,.reference:focus-within .remove{opacity:1}.remove:hover{background:#bc5548}.empty{grid-column:1/-1;padding:22px 10px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:12px}.prompt{display:block;width:100%;height:168px;resize:vertical;min-height:110px;max-height:360px;border:0;border-top:1px solid var(--line);background:transparent;margin:16px 0 0;padding:16px 9px 8px;color:#4b4842;line-height:1.9;font-size:14px;outline-offset:0!important}.tools{display:flex;align-items:center;gap:6px;padding:8px 0 9px}.icon-button{width:34px;height:34px;display:grid;place-items:center;padding:0;border:0;border-radius:10px;background:transparent;color:#625e56}.icon-button:hover{background:var(--soft)}.icon-button.active{color:var(--accent);background:var(--accent-soft)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.settings{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}.model,.parameter{display:flex;align-items:center;gap:8px;height:43px;padding:0 12px;border:1px solid transparent;border-radius:13px;background:var(--soft);white-space:nowrap;font-size:13px}.model{background:var(--panel);border-color:var(--line);box-shadow:0 2px 3px #2928260a;min-width:190px;justify-content:space-between}.model span{display:flex;gap:8px;align-items:center}.model>svg{width:14px;color:var(--muted)}.model span svg,.parameter svg{width:16px;height:16px}.generate{display:flex;align-items:center;justify-content:center;gap:7px;flex-shrink:0;height:43px;min-width:88px;padding:0 16px;border:0;border-radius:13px;background:var(--ink);color:var(--panel);font-weight:600}.generate:hover{background:#47423a}.generate svg{width:16px;height:16px}.layout-note{width:min(780px,100%);margin:17px auto 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}.layout-note strong{color:var(--accent);font-weight:500}.detail{width:min(780px,100%);margin:34px auto 0;padding-top:18px;border-top:1px solid #ded9d0;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.detail span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.detail p{margin:0;font-size:12px;color:#666057}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);padding:10px 16px;max-width:calc(100vw - 32px);border-radius:12px;background:var(--ink);color:var(--panel);font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.visible{opacity:1;transform:translate(-50%,0)}
    @container(max-width:620px){.reference-grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}.model{min-width:166px}.parameter{padding:0 10px}}
    @container(max-width:490px){.reference-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.toolbar{align-items:flex-end}.model{min-width:156px}}
    @container(max-width:350px){.reference-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:560px){.page{padding:24px 14px 32px}.intro{margin-top:27px}.node{padding:14px;border-radius:20px}.detail{grid-template-columns:1fr;gap:12px;margin-top:25px}.detail span{margin-bottom:0}.page-head{font-size:11px}.remove{opacity:1}.prompt{font-size:13px}.demo-controls{gap:8px}.tab{padding:6px 8px}.generate{min-width:70px;padding:0 12px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    @keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>

  <main class="page">
    <header class="page-head"><div class="brand"><svg><use href="#spark-icon"/></svg><span>INFINITE CANVAS</span><span class="prototype-label">布局预览</span></div><span>仅 HTML 原型 · 未修改正式组件</span></header>
    <section class="intro"><h1>参考内容，自动换行。</h1><p>每排最多 10 个，超出从下一排继续。缩略图保持比例，提示词和底部操作区自然下移。</p></section>
    <div class="demo-controls">
      <div class="tabs" role="group" aria-label="预览节点类型">
        <button class="tab" data-type="image" aria-pressed="false"><svg><use href="#image-icon"/></svg>图片</button>
        <button class="tab" data-type="video" aria-pressed="true"><svg><use href="#video-icon"/></svg>视频</button>
        <button class="tab" data-type="audio" aria-pressed="false"><svg><use href="#mic-icon"/></svg>音频</button>
        <button class="tab" data-type="text" aria-pressed="false"><svg><use href="#text-icon"/></svg>文本</button>
      </div>
      <div class="quantity" role="group" aria-label="参考数量演示"><span>参考数量</span><button data-count="1" aria-pressed="false">1</button><button data-count="10" aria-pressed="false">10</button><button data-count="11" aria-pressed="false">11</button><button data-count="23" aria-pressed="true">23</button></div>
    </div>
    <section class="node" aria-label="视频生成节点预览">
      <div class="references-heading"><div>参考内容<span class="reference-count" id="reference-count"></span></div><button class="add" id="add-reference"><svg><use href="#plus-icon"/></svg>添加参考</button></div>
      <div class="reference-grid" id="references" role="list" aria-label="参考素材"></div>
      <label hidden for="prompt">提示词</label><textarea class="prompt" id="prompt" spellcheck="false">【生成目标】
生成一段以云面高地为唯一场景的连续多镜头视频，保持主体、光照与画面风格一致。

小狗大黄从空中旋涡落到厚实云面，一头钻进云里；抬头后看见整片悬空的云海。云雾脱离原位向他飘来，他掉头逃跑，最后转头看向大黄。</textarea>
      <div class="tools">
        <button class="icon-button" title="放大编辑" aria-label="放大编辑" data-demo="编辑区域位置保持不变"><svg><use href="#expand-icon"/></svg></button>
        <button class="icon-button" title="提示词库" aria-label="提示词库" data-demo="提示词库入口位置保持不变"><svg><use href="#book-icon"/></svg></button>
        <button class="icon-button active" title="风格" aria-label="选择风格" id="style-button" data-demo="风格仍在左下角，仅请求时追加"><svg><use href="#spark-icon"/></svg></button>
        <button class="icon-button" title="语音预设" aria-label="语音预设" id="voice-button" data-demo="语音预设仍在左下角，仅对视频生效"><svg><use href="#mic-icon"/></svg></button>
      </div>
      <div class="toolbar"><div class="settings">
        <button class="model" data-demo="模型选择保持在左侧"><span><svg><use href="#model-icon"/></svg><span id="model-name">MT-2.5-720P</span></span><svg><use href="#chevron-icon"/></svg></button>
        <button class="parameter" data-demo="生成参数位置保持不变"><svg><use href="#settings-icon"/></svg><span id="parameter-label">720p · 横屏 · 3s</span></button>
        <button class="parameter camera" id="camera-button" data-demo="摄像机设置位置保持不变"><svg><use href="#camera-icon"/></svg>摄像机</button>
      </div><button class="generate" data-demo="这是布局原型，不会提交生成请求"><svg><use href="#send-icon"/></svg>生成</button></div>
    </section>
    <div class="layout-note"><span id="layout-summary" aria-live="polite"></span><span>缩小窗口可预览窄屏换行</span></div>
    <section class="detail" aria-label="布局说明"><div><span>01 / 数量</span><p>10 个一排，11 个两排，23 个三排。</p></div><div><span>02 / 展示</span><p>不横向滚动，不隐藏多余参考内容。</p></div><div><span>03 / 位置</span><p>只扩展参考区，模型仍在左侧。</p></div></section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const grid = document.getElementById('references');
    const node = document.querySelector('.node');
    const names = ['云上海岛','大黄出场','云面高地','跃入云层','回头特写','云海全景','穿过云脊','落在云面','追逐镜头','休息片刻','抬头凝望'];
    const crops = [39,109,179,249,319,389,459,529,599,669,739];
    const config = {image:{label:'图片',model:'GPT Image 2',parameter:'1:1 · 高清',prompt:'参考这些画面生成一张云面高地场景图。保持小狗大黄的外观、暖色光照和云层的细腻质感。'},video:{label:'视频',model:'MT-2.5-720P',parameter:'720p · 横屏 · 3s'},audio:{label:'音频',model:'音频模型',parameter:'立体声 · 标准',prompt:'参考上游文本与音频，生成温柔、自然的旁白，保留角色的声音特征。'},text:{label:'文本',model:'文本模型',parameter:'默认参数',prompt:'根据参考内容整理一段连贯的场景描述，保留人物关系与关键细节。'}};
    const videoPrompt = document.getElementById('prompt').value;
    let currentType = 'video';
    let sequence = 23;
    let items = Array.from({length:23},(_,index)=>index+1);
    let toastTimer;
    const icon = name => `<svg aria-hidden="true"><use href="#${name}-icon"/></svg>`;
    function summary(){
      const columns = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
      const rows = Array.from({length:Math.ceil(items.length/columns)},(_,index)=>Math.min(columns,items.length-index*columns));
      document.getElementById('layout-summary').innerHTML = items.length ? `<strong>${items.length} 个参考</strong> · ${rows.length} 排（${rows.join(' + ')}）` : '暂无参考内容 · 可点击右上角添加';
    }
    function render(){
      grid.replaceChildren();
      items.forEach((id,index)=>{
        const item = document.createElement('div');
        const audio = currentType === 'audio' && index % 3 !== 0;
        const text = (currentType === 'text' || currentType === 'audio') && !audio;
        const video = currentType === 'video' && index % 6 === 4;
        item.className = `reference${audio?' audio-card':text?' text-card':''}`;
        item.setAttribute('role','listitem');
        item.innerHTML = `${audio?icon('mic'):text?icon('text'):`<svg class="photo" viewBox="${crops[index%crops.length]} 66 58 58" role="img" aria-label="${names[index%names.length]}"><use href="#reference-sheet"/></svg>`}<span class="reference-number">${index+1}</span>${video?`<span class="media-tag">${icon('video')}</span>`:''}<button class="remove" aria-label="移除第 ${index+1} 个参考">${icon('close')}</button>`;
        item.querySelector('.remove').addEventListener('click',()=>{items=items.filter(value=>value!==id);render()});
        grid.append(item);
      });
      if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='暂无参考内容';grid.append(empty)}
      document.getElementById('reference-count').textContent=`${items.length} 个`;
      document.querySelectorAll('[data-count]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.count)===items.length)));
      summary();
    }
    document.querySelectorAll('[data-count]').forEach(button=>button.addEventListener('click',()=>{items=Array.from({length:Number(button.dataset.count)},()=>++sequence);render()}));
    document.getElementById('add-reference').addEventListener('click',()=>{items.push(++sequence);render()});
    document.querySelectorAll('[data-type]').forEach(button=>button.addEventListener('click',()=>{
      currentType=button.dataset.type;
      const selected=config[currentType];
      document.querySelectorAll('[data-type]').forEach(tab=>tab.setAttribute('aria-pressed',String(tab===button)));
      node.setAttribute('aria-label',`${selected.label}生成节点预览`);
      document.getElementById('model-name').textContent=selected.model;
      document.getElementById('parameter-label').textContent=selected.parameter;
      document.getElementById('prompt').value=currentType==='video'?videoPrompt:selected.prompt;
      document.getElementById('voice-button').hidden=currentType!=='video';
      document.getElementById('style-button').hidden=!['image','video'].includes(currentType);
      document.getElementById('camera-button').hidden=currentType!=='video';
      render();
    }));
    document.querySelectorAll('[data-demo]').forEach(button=>button.addEventListener('click',()=>{const toast=document.getElementById('toast');clearTimeout(toastTimer);toast.textContent=button.dataset.demo;toast.classList.add('visible');toastTimer=setTimeout(()=>toast.classList.remove('visible'),2200)}));
    new ResizeObserver(summary).observe(grid);
    render();
  </script>
